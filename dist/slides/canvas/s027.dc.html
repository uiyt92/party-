<section class="slide" style="width: 1280px; height: 720px">
  <p class="kicker">묻히는 첫 톡</p>
  <h2 class="head">"안녕하세요"는 <b>카톡함에서 묻힌다</b></h2>
  <p class="muted">활발한 사람의 카톡함엔 똑같은 첫 톡이 줄줄이 쌓인다. 그 안에서 "안녕하세요"는 그냥 배경이다.</p>
  <div class="kt2">
    <div class="col b">
      <p class="tit">✕ 뻔한 첫 톡</p>
      <div class="kt"><div class="kt-head">‹ 카톡함</div><div class="kt-body">
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">안녕하세요</div></div></div>
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">재밌게 놀고 계세요?</div></div></div>
      </div></div>
      <p class="cap">남들 다 보내는 말 → 누가 보냈는지 구분도 안 됨</p>
    </div>
    <div class="col g">
      <p class="tit">✓ 그 사람에게만 할 한마디</p>
      <div class="kt"><div class="kt-head">‹ 그 사람</div><div class="kt-body">
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">어제 보니까 되게 밝아 보이던데 ㅋㅋ</div></div></div>
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">오늘 무슨 기분 좋은 일 있었나봐요~?</div></div></div>
      </div></div>
      <p class="cap">슬쩍 넘겨짚기 + 상황 전달 → "나를 봤다"는 신호</p>
    </div>
  </div>
  <div class="box key"><span class="lbl">핵심</span>첫 톡은 멋있을 필요가 없다. 남들과 <b>'다르기만'</b> 하면 절반은 이긴 것이다.</div>
</section>
