  <h2 class="head">프사는 첫 톡보다 <b>먼저 말한다</b></h2>
  <p class="big">모르는 번호로 톡이 오면 다들 똑같이 한다. 말 읽기 전에 <b>프로필부터 누른다.</b></p>
  <div class="box key"><span class="lbl">핵심</span>표정 · 활동 · 화질, 이 세 가지로 0.5초 안에 절반쯤 판단이 끝난다. 한번 박힌 인상은 잘 안 바뀐다.</div>
  <div class="box psych"><span class="lbl">💡 왜 통할까</span>정보가 적을수록 사람은 단서 하나로 전체를 판단한다(후광효과). 사진 한 장이 괜찮으면 "괜찮은 사람이겠지" 하는 기대가 첫 톡까지 끌고 간다.</div>
