  <p class="muted">답이 30분째 없으면 초보는 벌써 결론낸다 — "아, 관심 없구나." 그리고 그 하나에 꽂혀 재촉한다.</p>

    <span class="step">깜빡함</span>
    <span class="step">고민 중</span>
    <span class="step" style="opacity:.45">…관심 없음</span>
  </div>
  <div class="box key"><span class="lbl">핵심</span>"관심 없음"은 그 수많은 이유 중 <b>하나일 뿐</b>이다. 늦었다는 사실 하나로 결론 내릴 수 없다.</div>
