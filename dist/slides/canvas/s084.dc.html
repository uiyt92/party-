  <p class="kicker">회색지대</p>
  <h2 class="head">애매한 <b>혼합 신호</b> 읽는 법</h2>
  <p class="muted">신호는 깔끔하게 한 방향으로만 오지 않는다. 헷갈릴 땐 <b>가장 약한 고리</b>로 읽어라.</p>
  <div class="kt3" style="margin-top:20px">
    <div class="col">
      <p class="tit">① 되묻는데 느림</p>
      <p class="sit">질문은 꼬박, 답은 몇 시간 뒤</p>
      <p class="key"><b>관심 있음, 우선순위 아님 — 속도 말고 내용으로 잡아라</b></p>
    </div>
    <div class="col">
      <p class="tit">② 길게 쓰는데 질문 0</p>
      <p class="sit">정성스러운데 되묻는 말이 없음</p>
      <p class="key"><b>대개 착한 예의 — 길이 말고 '되묻기'를 봐라</b></p>
    </div>
    <div class="col">
      <p class="tit">③ 빠른데 늘 내가 먼저</p>
      <p class="sit">답은 1분, 먼저 연락은 0번</p>
      <p class="key"><b>이틀 멈춰봐라 — 찾으면 호감, 조용하면 그냥 받아주던 것</b></p>
    </div>
  </div>
