  <h2 class="head">인스타는 <b>단서 보물창고</b></h2>
  <div class="box key"><span class="lbl">핵심</span>프사 한 장과는 비교가 안 된다. 아이디·소개란·피드 수십 장 — 단서가 없는 게 아니라 <b>안 본 것</b>이다.</div>
  <table>
    <tr><th>피드 모습</th><th>읽히는 성향</th><th>이렇게 던진다</th></tr>
    <tr><td>여행·맛집 많음</td><td>활동적·외향</td><td>그 장소·음식을 소재로</td></tr>
    <tr><td>본인 사진 적음</td><td>내향·신중</td><td>"뭔가 되게 I일 거 같아요 ㅋㅋ"</td></tr>
    <tr><td>피드 잘 꾸며짐</td><td>부지런·감각</td><td>외모 말고 그 감각을 칭찬</td></tr>
    <tr><td>운동·취미 꾸준</td><td>자기관리</td><td>"꾸준한 거 멋있다"</td></tr>
  </table>
  <div class="box key" style="margin-top:14px"><span class="lbl">아이디도 대화 소재다</span><b>vely · nabi</b> 같은 독특한 아이디 → "아이디 무슨 뜻이에요? ㅎㅎ" 한 줄이면 자연스럽게 열린다.</div>
