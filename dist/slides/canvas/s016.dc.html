  <h2 class="head">여유는 성격이 아니라 <b>숫자</b>에서 나온다</h2>
  <p class="muted">비울 게 하나뿐이면 절대 안 비워진다. 한 명에 100을 걸지 말고 셋에 나눠 걸어라.</p>
  <table style="margin-top:10px">
    <tr><th></th><th>한 명에 집중</th><th>여러 명과 알아가기 (3~4명)</th></tr>
    <tr><td>답장 안 올 때</td><td>하루가 무너짐</td><td>별일 아님</td></tr>
    <tr><td>톡의 무게</td><td>무겁고 절박함</td><td>가볍고 여유로움</td></tr>
    <tr><td>상대가 느끼는 것</td><td>부담</td><td>편안함</td></tr>
    <tr><td>결과</td><td>매달릴수록 멀어짐</td><td>여유로울수록 끌림</td></tr>
  </table>
  <div class="box key" style="margin-top:12px"><span class="lbl">덜 애쓰는 쪽이 우위</span>내 70 : 상대 30 → 끌려다님. 내가 늘 더 많이 보내고 있다면 그게 신호다. 한 박자 쉬어라.</div>
