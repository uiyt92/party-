  <div class="flow" style="margin:14px 0">
    <span class="step">첫 톡</span>
    <span class="arr">→</span>
    <span class="step">대화 유지</span>
    <span class="arr">→</span>

  </div>
  <div class="kt2">
    <div class="col b">
      <p class="tit">✕ 흔한 자폭</p>
      <div class="kt"><div class="kt-head">‹ 민지</div><div class="kt-body">
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">자나요?</div></div></div>
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">바쁜가 보네 ㅎㅎ</div></div></div>
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">답 기다리고 있었어요</div></div></div>
      </div></div>
      <p class="cap">답 오기 전에 혼자 빈칸 채우기</p>
    </div>
    <div class="col g">
      <p class="tit">✓ 교정</p>
      <div class="kt"><div class="kt-head">‹ 민지</div><div class="kt-body">
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">아까 그 카페 이름 뭐였죠 ㅋㅋ 까먹었어요</div></div></div>
        <div class="kt-sep">다음 날</div>
        <div class="kt-row kt-her"><div class="kt-av">🙂</div><div class="kt-wrap"><div class="kt-msg">아 ㅇㅇ카페요 ㅋㅋ</div></div></div>
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">맞다 거기 ㅋㅋ 혼자 가긴 좀</div></div></div>
      </div></div>
      <p class="cap">한 통, 그리고 멈춤</p>
    </div>
  </div>
  <div class="box psych"><span class="lbl">💡 왜 통할까</span>빈칸을 내가 다 메우면 상대는 할 일이 없다. 멈춤은 차례를 넘기는 행동이다.</div>
