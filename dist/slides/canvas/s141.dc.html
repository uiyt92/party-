  <p class="kicker">NG 단어·표현 블랙리스트</p>
  <h2 class="head">이 말 하나만 빼도 <b>답장률이 다르다</b></h2>
  <table style="margin-top:14px">
    <tr><th style="width:26%">피해야 할 말</th><th>왜 식나</th><th>대체</th></tr>
    <tr><td>자나요?</td><td>추궁처럼 들림</td><td>"아까 그거 어떻게 됐어요?"</td></tr>
    <tr><td>뭐해요?</td><td>매번 똑같고 영혼 없음</td><td>"오늘 그쪽 루틴 있어요?"</td></tr>
    <tr><td>바쁘세요?</td><td>거절할 핑계를 깔아줌</td><td>"토요일 2시 어때요?"</td></tr>
    <tr><td>답장 좀요</td><td>매달리는 티가 정면으로</td><td>"방금 이거 보다가 생각나서 ㅋㅋ"</td></tr>
    <tr><td>혹시 시간 되면…</td><td>자신 없음이 전해짐</td><td>"우리 금요일에 보자"</td></tr>
    <tr><td>진짜 예쁜 것 같아요</td><td>이른 외모 칭찬은 부담</td><td>"말투 특이하네요 ㅋㅋ"</td></tr>
  </table>
  <div class="box key" style="margin-top:14px"><span class="lbl">핵심</span>빼는 게 더 강하다. 식는 말 하나 지우는 게 좋은 말 하나 더하는 것보다 효과가 크다.</div>
