  <p class="muted">사람은 큰 부탁엔 방어하고, 작은 동의 뒤엔 다음 동의가 쉬워진다. 수위도 똑같다.</p>

        <div class="kt-row kt-her"><div class="kt-av">😐</div><div class="kt-wrap"><div class="kt-msg">ㅋㅋ갑자기 왜 그래</div></div></div>

      <p class="cap">상대를 멈춰 세운다</p>
    </div>
    <div class="col g">

      <div class="kt"><div class="kt-head">‹ 그분</div><div class="kt-body">
        <div class="kt-row r kt-me"><div class="kt-wrap"><div class="kt-msg">넌 사람 볼 때 뭐가 제일 중요해?</div></div></div>

      </div></div>
      <p class="cap">상대를 끌어들인다</p>
    </div>
