  <p class="kicker">호감 신호 읽기</p>
  <h2 class="head">신호는 하나가 아니라 <b>흐름</b>으로</h2>
  <p class="muted">답장 한 번 늦었다고 끝난 게 아니고, 한 번 빨랐다고 다 된 것도 아니다. 같은 신호가 두세 번 반복될 때만 의미가 있다.</p>
  <div class="grid2" style="margin-top:24px">
    <div class="box good">
      <span class="lbl">관심 있을 때</span>
      "○○님은요?" 하고 <b>되묻는다</b><br>
      안 물어본 자기 얘기를 먼저 꺼낸다<br>
      답장이 빠르고, 먼저 연락도 온다
    </div>
    <div class="box bad">
      <span class="lbl">식었을 때</span>
      늘 단답이고 <b>질문을 안 한다</b><br>
      답장이 갈수록 늦어진다<br>
      늘 내가 먼저, 내가 마지막
    </div>
  </div>
  <div class="box psych" style="margin-top:20px"><span class="lbl">💡 왜 통할까</span>말은 꾸밀 수 있어도 행동은 정직하다. 입에서 나온 말보다 답장 속도·되묻기·자기 노출 같은 행동 패턴이 진짜 마음에 더 가깝다.</div>
